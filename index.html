<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friendia — BD</title>
  <meta name="description" content="Your  Friendipp BD feed." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <!-- ===== Top Navigation ===== -->
  <header class="topnav" id="topnav"></header>

  <!-- ===== Main App Layout ===== -->
  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar left-sidebar" id="leftSidebar" aria-label="Primary navigation"></aside>

    <!-- Center Feed -->
    <main class="feed-column" id="feedColumn" aria-label="News feed">
      <!-- Stories injected here -->
      <section id="storiesSection" aria-label="Stories"></section>

      <!-- Composer card -->
      <section class="card composer" aria-label="Create post">
        <div class="composer-top">
          <div class="avatar-wrap">
            <img class="avatar" id="composerAvatar" alt="Your profile picture" />
          </div>
          <button class="composer-input" id="openComposerBtn">What's on your mind?</button>
        </div>
        <div class="composer-actions">
          <button class="composer-action" data-composer-type="photo">
            <span class="ci-photo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </span>
            Photo
          </button>
          <button class="composer-action" data-composer-type="video">
            <span class="ci-video">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
            </span>
            Video
          </button>
          <button class="composer-action" data-composer-type="event">
            <span class="ci-event">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            Event
          </button>
        </div>
      </section>

      <!-- Posts feed -->
      <section id="postsFeed" aria-label="Posts"></section>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar right-sidebar" id="rightSidebar" aria-label="Secondary content"></aside>
  </div>

  <!-- ===== Mobile Bottom Nav ===== -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>

  <!-- ===== Modal & Toast roots ===== -->
  <div id="modalRoot"></div>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- ===== Scripts ===== -->
  <script src="app.js"></script>
  <script src="notifications.js"></script>
  <script src="posts.js"></script>
  <script src="profile.js"></script>
  <script>
    // Boot the home page once the DOM is ready.
    document.addEventListener('DOMContentLoaded', () => {
      App.bootHomePage();
    });
  </script>
</body>
</html>
