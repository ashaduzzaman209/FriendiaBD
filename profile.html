<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Nexus</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <header class="topnav" id="topnav"></header>

  <div class="app-layout" style="grid-template-columns: minmax(0,1fr); max-width: 1000px;">
    <main id="profileMain" aria-label="Profile"></main>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>

  <div id="modalRoot"></div>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
  <script src="notifications.js"></script>
  <script src="posts.js"></script>
  <script src="profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.bootProfilePage();
    });
  </script>
</body>
</html>
